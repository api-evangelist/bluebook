aid: bluebook
name: Bluebook
description: 'Bluebook is a Stockholm, Sweden based software company building AI agents for accounting
  firms, accountants, and CFOs. The platform automates accounting workflows — reconciliations, accruals,
  accounts payable and receivable, month-end close, reporting, and accounting research — with the stated
  goal of a "zero-day close", and integrates with the general ledgers firms already run on, notably
  QuickBooks and NetSuite. The product surface is organized around Background Agents, Checklists (tasks,
  delegation, human-in-the-loop approvals, month-end close), and an Assistant covering FP&A, flux analysis,
  and accounting research. Founded in 2024 by Philip Andersson (CEO), Jonathan Andersson (COO), and Filip
  Stål (CTO), Bluebook went through Y Combinator (Winter 2025) and raised a $3M pre-seed led by EQT
  Ventures with participation from Y Combinator and angel investors from Affirm, OpenAI, and ElevenLabs.
  Bluebook is a product company, not an API provider: as of this enrichment pass it publishes no public
  developer program, API documentation, machine-readable specification, or SDKs.'
